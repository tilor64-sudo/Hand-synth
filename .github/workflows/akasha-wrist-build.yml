name: Build Akasha Wrist APK

on:
  push:
    branches: [akasha-wrist-build]
    paths:
      - 'akasha-wrist/**'
      - '.github/workflows/akasha-wrist-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: akasha-wrist
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Akasha-Wrist-debug-apk
          path: akasha-wrist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
