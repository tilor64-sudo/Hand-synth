name: Build KQi Lab APK

on:
  push:
    branches: [ kqilab-build-20260815 ]
    paths:
      - 'kqilab/**'
      - '.github/workflows/kqilab-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: kqilab
        run: gradle --no-daemon assembleDebug
      - name: Stage APK
        run: cp kqilab/app/build/outputs/apk/debug/app-debug.apk KQiLab-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KQiLab-APK
          path: KQiLab-v0.2-debug.apk
          if-no-files-found: error
